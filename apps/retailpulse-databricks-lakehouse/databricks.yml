bundle:
  name: retailpulse-databricks-lakehouse

workspace:
  host: ${DATABRICKS_HOST}
  token: ${DATABRICKS_TOKEN}

resources:
  jobs:
    retailpulse_job:
      name: retailpulse-job
      max_concurrent_runs: 1
      job_clusters:
        - job_cluster_key: retailpulse-cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 1
      tasks:
        - task_key: bronze_ingestion
          job_cluster_key: retailpulse-cluster
          notebook_task:
            notebook_path: ./notebooks/02_bronze_stream
        - task_key: silver_transformation
          job_cluster_key: retailpulse-cluster
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ./notebooks/03_silver_stream
        - task_key: gold_metrics
          job_cluster_key: retailpulse-cluster
          depends_on:
            - task_key: silver_transformation
          notebook_task:
            notebook_path: ./notebooks/04_gold_metrics
